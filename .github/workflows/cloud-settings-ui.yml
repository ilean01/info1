name: INFO1 cloud settings UI

on:
  push:
    paths:
      - '.github/workflows/cloud-settings-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move cloud controls into top Settings button
        shell: python
        run: |
          from pathlib import Path

          js = Path('cloud-sync.js')
          s = js.read_text(encoding='utf-8')
          marker = 'INFO1_CLOUD_SETTINGS_UI_V1'

          addon = r'''

/* INFO1_CLOUD_SETTINGS_UI_V1
   Keep cloud controls available without covering the study screen. */
(() => {
  const STYLE_ID = 'info1CloudSettingsUiStyles';
  const BTN_ID = 'info1CloudSettingsBtn';
  const BACKDROP_ID = 'info1CloudSettingsBackdrop';

  function injectStyles() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      #info1CloudBadge{display:none!important}
      #info1CloudBadge.info1-settings-open{
        display:block!important;
        position:fixed!important;
        top:86px!important;
        right:22px!important;
        bottom:auto!important;
        z-index:10002!important;
        width:min(560px,calc(100vw - 32px))!important;
        max-width:min(560px,calc(100vw - 32px))!important;
        padding:18px!important;
        border-radius:18px!important;
        box-shadow:0 24px 80px #000a!important;
      }
      #info1CloudBadge.info1-settings-open > span{display:block;margin:0 0 10px;font-size:14px;line-height:1.45}
      #info1CloudBadge.info1-settings-open button{margin:6px 6px 0 0!important}
      #info1CloudSettingsBackdrop{
        position:fixed;inset:0;z-index:10001;background:#02061788;
        backdrop-filter:blur(4px);display:none;
      }
      #info1CloudSettingsBackdrop.open{display:block}
      #info1CloudSettingsBtn{
        border:1px solid #334a70;background:#101b34;color:#eef4ff;
        border-radius:12px;padding:9px 12px;font-weight:850;cursor:pointer;
        white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
      }
      #info1CloudSettingsBtn:hover{border-color:#79a6ff;background:#16284b}
      #info1CloudSettingsBtn .cloud-dot{width:8px;height:8px;border-radius:999px;background:#94a3b8;box-shadow:0 0 0 3px #94a3b822}
      #info1CloudSettingsBtn.cloud-ok .cloud-dot{background:#22c55e;box-shadow:0 0 0 3px #22c55e22}
      #info1CloudSettingsBtn.cloud-warn .cloud-dot{background:#f59e0b;box-shadow:0 0 0 3px #f59e0b22}
      #info1CloudSettingsBtn.cloud-bad .cloud-dot{background:#ef4444;box-shadow:0 0 0 3px #ef444422}
      @media(max-width:700px){
        #info1CloudSettingsBtn{padding:8px 10px}
        #info1CloudBadge.info1-settings-open{top:74px!important;right:12px!important;width:calc(100vw - 24px)!important;max-width:none!important}
      }
    `;
    document.head.appendChild(style);
  }

  function closePanel() {
    document.getElementById('info1CloudBadge')?.classList.remove('info1-settings-open');
    document.getElementById(BACKDROP_ID)?.classList.remove('open');
    document.getElementById(BTN_ID)?.setAttribute('aria-expanded','false');
  }

  function ensureBackdrop() {
    let backdrop = document.getElementById(BACKDROP_ID);
    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.id = BACKDROP_ID;
      backdrop.addEventListener('click', closePanel);
      document.body.appendChild(backdrop);
    }
    return backdrop;
  }

  function updateButtonState() {
    const btn = document.getElementById(BTN_ID);
    const badge = document.getElementById('info1CloudBadge');
    if (!btn) return;
    btn.classList.remove('cloud-ok','cloud-warn','cloud-bad');
    if (badge?.classList.contains('ok')) btn.classList.add('cloud-ok');
    else if (badge?.classList.contains('bad')) btn.classList.add('cloud-bad');
    else if (badge?.classList.contains('warn')) btn.classList.add('cloud-warn');
    const statusText = badge?.querySelector('span')?.textContent?.trim();
    btn.title = statusText || 'Ajustes de sincronización y nube';
  }

  function togglePanel() {
    const badge = document.getElementById('info1CloudBadge');
    if (!badge) return;
    const opening = !badge.classList.contains('info1-settings-open');
    if (!opening) return closePanel();
    ensureBackdrop().classList.add('open');
    badge.classList.add('info1-settings-open');
    document.getElementById(BTN_ID)?.setAttribute('aria-expanded','true');
  }

  function ensureButton() {
    injectStyles();
    if (document.getElementById(BTN_ID)) {
      updateButtonState();
      return;
    }
    const btn = document.createElement('button');
    btn.id = BTN_ID;
    btn.type = 'button';
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-controls','info1CloudBadge');
    btn.innerHTML = '<span class="cloud-dot" aria-hidden="true"></span><span>⚙️ Ajustes</span>';
    btn.addEventListener('click', togglePanel);

    const topTabs = document.querySelector('.partial-switcher-tabs');
    const toolbar = document.querySelector('.toolbar');
    if (topTabs) topTabs.appendChild(btn);
    else if (toolbar) toolbar.appendChild(btn);
    else document.body.prepend(btn);
    updateButtonState();
  }

  const observer = new MutationObserver(() => {
    ensureButton();
    updateButtonState();
  });

  function bootSettingsUi() {
    injectStyles();
    ensureBackdrop();
    ensureButton();
    observer.observe(document.body, {childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootSettingsUi, {once:true});
  else bootSettingsUi();

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });
})();
'''

          if marker not in s:
              s += addon
              js.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('./cloud-sync.js?v=stable-20260925-2', './cloud-sync.js?v=settings-20260925-1')
          h = h.replace('./cloud-sync.js?v=stable-20260925-1', './cloud-sync.js?v=settings-20260925-1')
          h = h.replace('./cloud-sync.js"', './cloud-sync.js?v=settings-20260925-1"')
          index.write_text(h, encoding='utf-8')

      - name: Commit settings UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'INFO1 UI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud-sync.js index.html
          git commit -m 'ui: move cloud controls into top settings button'
          git push
