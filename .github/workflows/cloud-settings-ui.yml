name: INFO1 cloud settings UI

on:
  push:
    paths:
      - '.github/workflows/cloud-settings-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject compact settings controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./cloud-settings-ui.js?v=20260925-1"></script>'
          if tag not in s:
              anchor = '<script src="./cloud-sync.js?v=stable-20260925-2"></script>'
              if anchor not in s:
                  anchor = '<script src="./cloud-sync.js?v=settings-20260925-1"></script>'
              if anchor not in s:
                  anchor = '<script src="./cloud-sync.js"></script>'
              if anchor not in s:
                  raise SystemExit('cloud-sync script tag not found')
              s = s.replace(anchor, anchor + '\n' + tag, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit settings UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'INFO1 UI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: move cloud controls behind top settings button'
          git push
