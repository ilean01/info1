name: INFO1 release marker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release.json'
      - '.github/workflows/release-version.yml'

permissions:
  contents: write

concurrency:
  group: info1-release-marker
  cancel-in-progress: true

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write release marker
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, datetime
          payload = {
            "release": os.environ.get("GITHUB_SHA", ""),
            "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open("release.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
            f.write("\n")
          PY
          git config user.name 'INFO1 release bot'
          git config user.email 'actions@users.noreply.github.com'
          git add release.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish INFO1 release marker"
          git pull --rebase origin main
          git push
