name: INFO1 install device sync

on:
  push:
    paths:
      - '.github/workflows/install-device-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mobile sync v4
        run: python3 scripts/mobile-sync-v4.py
      - name: Commit mobile sync v4
        shell: bash
        run: |
          git config user.name 'INFO1 sync bot'
          git config user.email 'actions@users.noreply.github.com'
          git add device-sync.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: auto-update mobile and bridge timer stop from old clients'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
