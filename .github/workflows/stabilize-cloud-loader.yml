name: INFO1 stable cloud loader

on:
  push:
    paths:
      - '.github/workflows/stabilize-cloud-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize cloud loader and browser backup import
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<script src="\./cloud-sync\.js(?:\?[^\"]*)?"></script>',
                     '<script src="./cloud-sync.js?v=stable-20260925-3"></script>', s, count=1)
          s = re.sub(r'<script src="\./supabase-media-bridge\.js(?:\?[^\"]*)?"></script>',
                     '<script src="./supabase-media-bridge.js?v=stable-20260925-3"></script>', s, count=1)
          s = re.sub(r'<script src="\./supabase-config\.js(?:\?[^\"]*)?"></script>',
                     '<script src="./supabase-config.js?v=stable-20260925-3"></script>', s, count=1)

          # Browser-export backups have {fecha, origen, localStorage:{...}}. The old
          # importer only accepted raw state/state wrappers, so it rejected the
          # exact recovery file we need. Accept both formats without changing data.
          old = "const obj=JSON.parse(await f.text()),candidate=normalizeLoadedState(obj.state||obj);"
          new = "const obj=JSON.parse(await f.text());let source=obj.state||obj;if(obj?.localStorage&&typeof obj.localStorage==='object'){const packed=obj.localStorage[STORAGE_KEY];if(typeof packed==='string'){try{source=JSON.parse(packed)}catch(_){throw Error('El backup del navegador contiene progreso inválido')}}}const candidate=normalizeLoadedState(source);"
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              "alert('Backup importado. Se conservaron las fotos existentes.');",
              "alert('Backup importado. Se conservaron las fotos existentes. Si la nube marca conflicto, elegí “Mantener este dispositivo” para subir esta copia correcta.');",
              1
          )

          # Never re-register a service worker while we are stabilising Pages.
          s = re.sub(
              r"if \('serviceWorker' in navigator && location\.protocol !== 'file:'\) \{\s*window\.addEventListener\('load', \(\) => navigator\.serviceWorker\.register\('\./service-worker\.js'\)\.catch\(console\.warn\)\);\s*\}",
              "if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); }",
              s,
              count=1
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit stabilization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'INFO1 stability bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: accept browser backup and keep cloud conflict-safe'
          git push
