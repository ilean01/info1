name: INFO1 settings freeze cache bust

on:
  push:
    paths:
      - '.github/workflows/cachebust-settings-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh settings controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('cloud-settings-ui.js?v=20260925-1','cloud-settings-ui.js?v=20260925-2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'INFO1 UI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load non-blocking settings controller'
          git push
