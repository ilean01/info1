name: INFO1 runtime hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-runtime-storm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize GitHub Pages runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = 'INFO1_GITHUB_NETWORK_GUARD_V13'
          if marker not in s:
              guard = r'''<script>
          /* INFO1_GITHUB_NETWORK_GUARD_V13 */
          (() => {
            if (!location.hostname.endsWith('github.io')) return;
            const realFetch = window.fetch.bind(window);
            window.__INFO1_REAL_FETCH__ = realFetch;
            const json = (data, status=200) => new Response(JSON.stringify(data), {
              status,
              headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}
            });
            window.fetch = async function(input, init={}) {
              let url;
              try { url = new URL(typeof input === 'string' ? input : input?.url, location.href); }
              catch { return realFetch(input, init); }
              if (url.origin === location.origin && url.pathname.startsWith('/api/')) {
                const method = String(init?.method || input?.method || 'GET').toUpperCase();
                if (url.pathname === '/api/health') return json({ok:false,mode:'github-pages-no-legacy-api'},503);
                if (url.pathname === '/api/photos' && method === 'GET') return json([]);
                if (url.pathname.startsWith('/api/photos')) return json({error:'Legacy photo API disabled on GitHub Pages'},503);
                if (url.pathname === '/api/state' && method === 'POST') return json({revision:Date.now(),savedAt:new Date().toISOString(),provider:'supabase'},200);
                if (url.pathname === '/api/state/history' && method === 'GET') return json({versions:[]},200);
                if (url.pathname === '/api/state' && method === 'GET') return json({error:'Legacy state API disabled'},404);
                return json({error:'Legacy API disabled'},404);
              }
              return realFetch(input, init);
            };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))).catch(()=>{});
            }
            if (window.caches?.keys) {
              window.caches.keys().then(keys => Promise.all(keys.map(k => window.caches.delete(k)))).catch(()=>{});
            }
          })();
          </script>'''
              s = s.replace('<head>', '<head>\n' + guard, 1)

          # Never probe or use the old media HTTP API on GitHub Pages. The app
          # falls back to IndexedDB for photos while state sync continues via Supabase.
          s = re.sub(
              r'if\(location\.hostname\.endsWith\("github\.io"\)\)return !!window\.INFO1_SUPABASE_CLIENT;',
              'if(location.hostname.endsWith("github.io"))return false;',
              s
          )

          # Do not auto-load PDFs that are not in the repository yet. Automatic
          # PDF loads were generating repeated 404/429 traffic and confusing Chrome.
          s = s.replace('src="/info1/materiales/05_PDA.pdf#page=1"', 'src="about:blank" data-src="/info1/materiales/05_PDA.pdf#page=1"')
          s = s.replace('src="/info1/materiales/examenes_merged.pdf#page=1"', 'src="about:blank" data-src="/info1/materiales/examenes_merged.pdf#page=1"')

          # Stop the page from registering a service worker while the migration is
          # stabilised. The early guard above also unregisters any old installation.
          s = re.sub(
              r"if \('serviceWorker' in navigator && location\.protocol !== 'file:'\) \{\s*window\.addEventListener\('load', \(\) => navigator\.serviceWorker\.register\('\./service-worker\.js'\)\.catch\(console\.warn\)\);\s*\}",
              "if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); }",
              s,
              count=1
          )

          p.write_text(s, encoding='utf-8')

      - name: Install service-worker kill switch
        shell: bash
        run: |
          cat > service-worker.js <<'EOF'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              } catch (_) {}
              try { await self.registration.unregister(); } catch (_) {}
              try { await self.clients.claim(); } catch (_) {}
            })());
          });
          // No fetch handler on purpose. GitHub Pages serves INFO1 directly.
          EOF

      - name: Commit stability hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'INFO1 hotfix bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'fix: disable legacy API storm and stale service worker'
          git push
