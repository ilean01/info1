name: INFO1 fix cloud conflict

on:
  push:
    paths:
      - '.github/workflows/fix-cloud-conflict.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch cloud sync conflict recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cloud-sync.js')
          s = p.read_text(encoding='utf-8')

          old = '''    if (remoteRaw === here || (!here && remoteRaw === '{}')) {
      localStorage.setItem(`${HYDRATED_PREFIX}${workspace.id}`, String(remoteRevision));
      localStorage.removeItem(UNSYNCED_KEY);
      dirty = false;
      conflict = false;
      lastSeenRaw = here;
      showSyncedBadge();
      return;
    }

    // Antes se aplicaba la nube automáticamente durante el arranque. Ese era
'''
          new = '''    const hydratedRevision = Number(localStorage.getItem(`${HYDRATED_PREFIX}${workspace.id}`) || 0);
    const hasUnsyncedLocal = localStorage.getItem(UNSYNCED_KEY) === '1';

    // Si este dispositivo ya aceptó exactamente esta revisión y no quedaron
    // cambios locales pendientes, una pequeña normalización del estado durante
    // el arranque NO es un conflicto real. Evitamos el bucle "Cargar nube" →
    // recargar → volver a mostrar el mismo aviso.
    if (hydratedRevision === remoteRevision && !hasUnsyncedLocal) {
      dirty = false;
      conflict = false;
      lastSeenRaw = here;
      showSyncedBadge();
      return;
    }

    if (remoteRaw === here || (!here && remoteRaw === '{}')) {
      localStorage.setItem(`${HYDRATED_PREFIX}${workspace.id}`, String(remoteRevision));
      localStorage.removeItem(UNSYNCED_KEY);
      dirty = false;
      conflict = false;
      lastSeenRaw = here;
      showSyncedBadge();
      return;
    }

    // Antes se aplicaba la nube automáticamente durante el arranque. Ese era
'''
          if old not in s:
              raise SystemExit('inspectInitialState target not found')
          s = s.replace(old, new, 1)

          old2 = '''      badge(
        `☁️ Copia de Supabase guardada en este dispositivo · rev ${remoteRevision}. Actualizá la pantalla para mostrarla.`,
        'ok',
        '<button class="primary" id="info1ReloadCloud">Actualizar pantalla</button><button id="info1ImportBackup">Importar backup</button>'
      );
      bindStandardActions();
'''
          new2 = '''      showSyncedBadge(`☁️ Nube aplicada correctamente · rev ${remoteRevision}`);

      // Una carga solicitada por la persona debe terminar mostrando esa copia
      // en pantalla, sin exigir un segundo botón. La revisión hidratada queda
      // marcada antes de recargar para que el siguiente arranque no vuelva a
      // presentar el mismo falso conflicto.
      if (userInitiated) {
        const url = new URL(location.href);
        url.searchParams.set('_info1cloud', String(Date.now()));
        setTimeout(() => location.replace(url.toString()), 180);
      }
'''
          if old2 not in s:
              raise SystemExit('loadCloudIntoLocal target not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

          # Bust the script URL so already-open mobile/PWA clients fetch the fix.
          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('./cloud-sync.js?v=stable-20260925-3', './cloud-sync.js?v=cloudfix-20260930-1')
          html = html.replace('./device-sync.js?v=20260925-1', './device-sync.js?v=cloudfix-20260930-1')
          idx.write_text(html, encoding='utf-8')
          PY
      - name: Commit definitive cloud sync fix
        shell: bash
        run: |
          git config user.name 'INFO1 sync bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud-sync.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: stop repeated Supabase conflict after loading cloud'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push conflict, retry $attempt/5"
            sleep $((attempt * 2))
          done
          exit 1
