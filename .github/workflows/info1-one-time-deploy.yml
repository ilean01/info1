name: INFO1 staged deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info1-one-time-deploy.yml'
      - 'xzpayload/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild INFO1 index from staged xz payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, re

          root = Path('xzpayload')
          files = list(root.glob('*.b64'))
          if not files:
              raise SystemExit('No xzpayload chunks found')

          def sort_key(path: Path):
              m = re.fullmatch(r'(\d+)([a-z]?)\.b64', path.name)
              if not m:
                  raise SystemExit(f'Unexpected chunk name: {path.name}')
              return (int(m.group(1)), m.group(2))

          files.sort(key=sort_key)
          print('chunks:', [p.name for p in files])

          encoded = ''.join(''.join(p.read_text().split()) for p in files)
          print('base64 chars:', len(encoded))
          if len(encoded) != 151128:
              raise SystemExit(f'Unexpected base64 size: {len(encoded)}')

          raw = base64.b64decode(encoded, validate=True)
          print('xz bytes:', len(raw), 'sha256:', hashlib.sha256(raw).hexdigest())
          if len(raw) != 113344:
              raise SystemExit(f'Unexpected xz size: {len(raw)}')

          html = lzma.decompress(raw)
          print('html bytes:', len(html), 'sha256:', hashlib.sha256(html).hexdigest())
          if len(html) < 1000000:
              raise SystemExit('Rebuilt index is unexpectedly small')

          lower = html.lower()
          if b'<html' not in lower or b'</html>' not in lower:
              raise SystemExit('Rebuilt payload is not a complete HTML document')

          for required in (b'cloud-sync.js', b'supabase-config.js', b'service-worker.js'):
              if required not in html:
                  raise SystemExit(f'Missing reference: {required.decode()}')

          Path('index.html').write_bytes(html)
          PY

      - name: Commit rebuilt index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already up to date'
            exit 0
          fi
          git commit -m 'Rebuild complete INFO1 index'
          git push origin HEAD:main
