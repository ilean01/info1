name: INFO1 staged deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info1-one-time-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose staged INFO1 payloads
        run: |
          set -euo pipefail
          for spec in "app-parts/*.txt" "bundle/*.b64" "payload12/*.b64"; do
            echo "=== $spec ==="
            if compgen -G "$spec" > /dev/null; then
              cat $spec > /tmp/payload.b64
              echo "base64-bytes=$(wc -c < /tmp/payload.b64)"
              if base64 -d /tmp/payload.b64 > /tmp/payload.bin 2>/tmp/base64.err; then
                echo "decoded-bytes=$(wc -c < /tmp/payload.bin)"
                file /tmp/payload.bin || true
                if gzip -t /tmp/payload.bin 2>/tmp/gzip.err; then
                  gzip -dc /tmp/payload.bin > /tmp/payload.out
                  echo "gunzip-bytes=$(wc -c < /tmp/payload.out)"
                  echo "head:"; head -c 120 /tmp/payload.out | tr '\n' ' '; echo
                  echo "tail:"; tail -c 120 /tmp/payload.out | tr '\n' ' '; echo
                  grep -q 'cloud-sync.js' /tmp/payload.out && echo 'contains-cloud-sync=yes' || echo 'contains-cloud-sync=no'
                  grep -q 'supabase-config.js' /tmp/payload.out && echo 'contains-supabase-config=yes' || echo 'contains-supabase-config=no'
                else
                  echo 'gzip=no'
                  cat /tmp/gzip.err || true
                fi
              else
                echo 'base64=no'
                cat /tmp/base64.err || true
              fi
            else
              echo 'missing'
            fi
          done
