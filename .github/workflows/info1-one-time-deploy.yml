name: INFO1 staged deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info1-one-time-deploy.yml'
      - 'xzpayload/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild INFO1 index from staged xz payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, re

          root = Path('xzpayload')
          files = list(root.glob('*.b64'))
          if not files:
              raise SystemExit('No xzpayload chunks found')

          def key(path):
              m = re.fullmatch(r'(\d+)([a-z]?)\.b64', path.name)
              if not m:
                  return (10**9, path.name)
              return (int(m.group(1)), m.group(2))

          files.sort(key=key)
          parts = []
          for p in files:
              text = ''.join(p.read_text().split())
              try:
                  decoded = base64.b64decode(text, validate=True)
              except Exception as exc:
                  raise SystemExit(f'{p}: invalid base64: {exc}')
              print(f'{p.name}: {len(text)} base64 chars -> {len(decoded)} bytes')
              parts.append(decoded)

          raw = b''.join(parts)
          try:
              html = lzma.decompress(raw)
          except Exception as exc:
              raise SystemExit(f'XZ payload could not be decompressed: {exc}')

          print('chunks:', [p.name for p in files])
          print('decoded xz bytes:', len(raw))
          print('html bytes:', len(html))
          print('sha256:', hashlib.sha256(html).hexdigest())

          if len(html) < 500000:
              raise SystemExit('Rebuilt index is unexpectedly small')
          lower = html.lower()
          if b'<html' not in lower or b'</html>' not in lower:
              raise SystemExit('Rebuilt payload is not a complete HTML document')
          if b'cloud-sync.js' not in html or b'supabase-config.js' not in html:
              raise SystemExit('Supabase scripts are missing from rebuilt index')

          Path('index.html').write_bytes(html)
          PY

      - name: Commit rebuilt index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already up to date'
            exit 0
          fi
          git commit -m 'Rebuild complete INFO1 index'
          git push origin HEAD:main
