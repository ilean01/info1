name: INFO1 staged deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info1-one-time-deploy.yml'
      - 'exact-xz/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild INFO1 index from exact payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib

          root = Path('exact-xz')
          files = sorted(root.glob('*.b64'))
          if not files:
              raise SystemExit('No exact-xz chunks found')

          parts = []
          for p in files:
              text = ''.join(p.read_text().split())
              decoded = base64.b64decode(text, validate=True)
              print(f'{p.name}: {len(text)} chars -> {len(decoded)} bytes')
              parts.append(decoded)

          raw = b''.join(parts)
          print('xz bytes:', len(raw), 'sha256:', hashlib.sha256(raw).hexdigest())
          if len(raw) != 113344:
              raise SystemExit(f'Unexpected xz size: {len(raw)}')

          html = lzma.decompress(raw)
          print('html bytes:', len(html), 'sha256:', hashlib.sha256(html).hexdigest())
          if len(html) < 1000000:
              raise SystemExit('Rebuilt index is unexpectedly small')
          lower = html.lower()
          if b'<html' not in lower or b'</html>' not in lower:
              raise SystemExit('Rebuilt payload is not a complete HTML document')
          for required in (b'cloud-sync.js', b'supabase-config.js', b'service-worker.js'):
              if required not in html:
                  raise SystemExit(f'Missing reference: {required.decode()}')

          Path('index.html').write_bytes(html)
          PY

      - name: Commit rebuilt index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already up to date'
            exit 0
          fi
          git commit -m 'Rebuild complete INFO1 index'
          git push origin HEAD:main
