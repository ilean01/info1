name: INFO1 staged deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/info1-one-time-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild real INFO1 index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib

          root = Path('index-payload-v2')
          files = [root / f'{i:03d}.b64' for i in range(11)]
          missing = [str(p) for p in files if not p.exists()]
          if missing:
              raise SystemExit(f'Missing chunks: {missing}')

          parts = []
          for p in files:
              text = ''.join(p.read_text().split())
              decoded = base64.b64decode(text, validate=True)
              print(f'{p.name}: {len(text)} chars -> {len(decoded)} bytes')
              parts.append(decoded)

          raw = b''.join(parts)
          raw_hash = hashlib.sha256(raw).hexdigest()
          print('xz bytes:', len(raw), 'sha256:', raw_hash)
          if len(raw) != 113336:
              raise SystemExit(f'Unexpected xz size: {len(raw)}')
          if raw_hash != '8654f7b6c6b2d72f992cd02f84837d3ba40f70e939e8e189fc438ffae1ae965a':
              raise SystemExit('XZ checksum mismatch')

          html = lzma.decompress(raw)
          html_hash = hashlib.sha256(html).hexdigest()
          print('html bytes:', len(html), 'sha256:', html_hash)
          if len(html) != 1024745:
              raise SystemExit(f'Unexpected HTML size: {len(html)}')
          if html_hash != 'bca2edd64bec5a01d292db2eb6b6c01d08bce822664b46f64ed7870f87901b71':
              raise SystemExit('HTML checksum mismatch')

          lower = html.lower()
          if b'<html' not in lower or b'</html>' not in lower:
              raise SystemExit('Not a complete HTML document')
          for required in (b'cloud-sync.js', b'supabase-config.js', b'service-worker.js', b'manifest.webmanifest'):
              if required not in html:
                  raise SystemExit(f'Missing reference: {required.decode()}')

          Path('index.html').write_bytes(html)
          PY

      - name: Commit rebuilt index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already up to date'
            exit 0
          fi
          git commit -m 'Restore real INFO1 index'
          git push origin HEAD:main
